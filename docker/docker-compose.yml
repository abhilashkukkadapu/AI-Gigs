version: "3.9"
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../media:/app/media
      - ../exports:/app/exports
      - ../data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - redis
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ../media:/app/media
      - ../exports:/app/exports
      - ../data:/app/data
    depends_on:
      - redis
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - api
